name: Build and Release Antigravity Orbit

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Windows Executable
        run: |
          python scripts/build.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Orbit-Windows-x64
          path: dist/Antigravity-Orbit-Windows-x64.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS Application
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build macOS Application
        run: |
          python3 scripts/build.py

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Orbit-macOS
          path: dist/Antigravity-Orbit-macOS.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release files
        run: |
          mkdir -p final-release
          find release-artifacts -type f -name "*.zip" -exec cp {} final-release/ \;
          echo "Release files prepared:"
          ls -lh final-release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: final-release/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
